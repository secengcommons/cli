version: "2"
formatters:
  enable:
    - gofmt
linters:
  settings:
    cyclop:
      max-complexity: 12
      package-average: 0.0
    errcheck:
      check-blank: true
      check-type-assertions: true
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    misspell:
      mode: restricted
    nolintlint:
      require-explanation: true
      require-specific: true
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - asciicheck
    - bidichk
    - cyclop
    - dupl
    - errorlint
    - errchkjson
    - exhaustive
    - funlen
    - gocognit
    - godox
    - gosec
    - makezero
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - recvcheck
    - unparam
    - usetesting
